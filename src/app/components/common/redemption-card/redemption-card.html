<div [class]="card().type" class="ks-card">
  <div class="flex gap-4">
    <ks-icon [name]="card().logo!" size="3.5rem" />

    <div class="flex-1 flex flex-col gap-2">
      <span class="card__title">{{ card().title }}</span>
      <span class="card__description">{{ card().description }}</span>
    </div>

    @let pinIcon = pinned() ? 'unpin' : 'pin';
    <div (click)="togglePinState()" class="ks-icon-button" role="button">
      <ks-icon [name]="pinIcon" class="h-fit" />
    </div>
  </div>

  <div class="flex justify-center mt-4">
    @if (isGovernor()) {
      <button (click)="redeemForGovernor()">
        <ks-icon name="gift" />
        Redeem codes
      </button>
    } @else {
      <button (click)="viewAlliance()">
        <ks-icon name="user-group" />
        View
      </button>
    }
  </div>
</div>

<h1>
  <ks-icon name="pin" size="1.5rem" />
  Pinned
</h1>

<div class="flex flex-wrap gap-4">
  @for (governor of governors(); track governor.id) {
    <ks-redemption-card [governor]="governor" [pinned]="true" />
  }
  @for (alliance of alliances(); track alliance.tag) {
    <ks-redemption-card [alliance]="alliance" [pinned]="true" />
  }
</div>

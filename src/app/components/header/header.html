<div class="header__title">
  <ks-icon [name]="content().logo" size="3rem" />
  <div class="header__title-main">{{ content().title }}</div>
</div>
<div class="header__title-subtitle">{{ content().subtitle }}</div>

@if (appState.alliance(); as alliance) {
  <div class="header__actions">
    <button class="header__actions-redeem">
      <ks-icon name="gift" />
      Redeem codes
    </button>
    @if (alliance.lastSync) {
      <span>Last sync: {{ alliance.lastSync | date }}</span>
    }
  </div>
}
